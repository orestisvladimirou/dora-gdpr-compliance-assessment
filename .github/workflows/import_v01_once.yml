name: Import validated DORA-GDPR v0.1 once

on:
  push:
    paths:
      - ".github/workflows/import_v01_once.yml"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and extract original project package
        run: |
          echo "cbae73936293fc0d26916671377482d4a4bc16a52c046f312d961be9d0faf06f  _import_dora_v01.zip" | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile("_import_dora_v01.zip") as z:
              names=z.namelist()
              assert len(names)==28 and len(names)==len(set(names)), "Unexpected project file count"
              for name in names:
                  path=Path(name)
                  assert not path.is_absolute() and ".." not in path.parts, f"Unsafe archive member: {name}"
              z.extractall(".")
          print("PASS source archive: 28 validated project files extracted")
          PY
          git rm _import_dora_v01.zip .github/workflows/import_v01_once.yml
      - name: Verify authoritative manifest and all source files
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path(".")
          manifest=json.loads(Path("SOURCE_MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["version"]=="0.1"
          checked=set()
          for item in manifest["files"]:
              path=root/item["path"]
              assert path.is_file(), f"Missing {path}"
              data=path.read_bytes()
              assert hashlib.sha256(data).hexdigest()==item["sha256"],f"Mismatch: {path}"
              assert len(data)==item["size"],f"Size mismatch: {path}"
              checked.add(item["path"])
          actual={p.as_posix() for p in root.rglob("*") if p.is_file() and ".git" not in p.parts and "__pycache__" not in p.parts and p.suffix!=".pyc" and p.name!="SOURCE_MANIFEST.json"}
          assert actual==checked, f"Manifest inventory mismatch missing={actual-checked} extra={checked-actual}"
          print(f"PASS manifest: {len(checked)} source files matched their original checksums")
          PY
      - name: Run source verification and seven regression tests
        run: |
          python scripts/validate_project.py
          python -m unittest discover -s tests -v
      - name: Commit imported v0.1 foundation and remove one-time helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/validate.yml
          git add -A
          git commit -m "Import verified fictional DORA-GDPR compliance case study v0.1"
          git push origin HEAD:main
