name: Refresh verified DORA-GDPR v0.4 source manifest once

on:
  push:
    paths:
      - ".github/workflows/refresh_manifest_once.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove one-time workflow and regenerate current source inventory
        run: |
          git rm .github/workflows/refresh_manifest_once.yml
          python scripts/regenerate_manifest.py
      - name: Verify original, Phase 2, Phase 3 and portfolio records
        run: |
          python scripts/validate_project.py
          python scripts/validate_phase2.py
          python scripts/validate_phase3.py
          python scripts/validate_portfolio.py
          python scripts/validate_manifest.py
          python -m unittest discover -s tests -v
      - name: Commit verified manifest and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize source-verified DORA-GDPR portfolio v0.4"
          git push origin HEAD:main
